# Third-party notices

## Animation: stackedlol/ascii-sharks

- Author: stackedlol and upstream contributors.
- Source: https://github.com/stackedlol/ascii-sharks
- Upstream commit: `c521e24a787e6d4cc460d4cf2b9815f25e4fe453`.
- License status checked: 2026-10-23. No license file or software license
  declaration was found in the upstream repository at this commit.
- Adapted files: `src/engine.ts`, `src/world.ts`, `src/renderer.ts`,
  `src/species.ts`, `src/math.ts`.

Changes in this project include additional species and manta-ray contours,
multiple character renderers, light/dark palettes, pause/speed controls,
and the surrounding translucent search/music/focus interfaces.

Credit to the upstream author is retained in source comments, README.md, and this notice. No upstream
copyright or license is replaced by the MIT grant for the new frontend files.

<body>
  <canvas id="ocean" aria-hidden="true"></canvas>
  <div class="soft-light" aria-hidden="true"></div>

  <main class="hero">
    <h1 id="hero-title">take a little break.</h1>
    <section class="center-panel player-panel glass" id="music-panel" aria-label="Music player demo">
      <div class="track-info">
        <div class="waveform" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="track-copy"><p id="track-title">Somewhere, slowly</p><p id="track-artist">Late Tide</p></div>
      </div>
      <div class="track-progress">
        <input id="track-seek" type="range" min="0" max="272" step="1" value="84" aria-label="Playback position">
        <span class="track-time"><span id="track-elapsed">1:24</span><span class="time-slash">/</span><span id="track-duration">4:32</span></span>
      </div>
      <div class="player-buttons">
        <button class="icon-button" id="track-previous" aria-label="Previous track" title="Previous track"><svg viewBox="0 0 24 24"><path d="M5 5v14m14-14L8 12l11 7Z"/></svg></button>
        <button class="icon-button primary-play" id="track-play" aria-label="Play demo" aria-pressed="false" title="Play demo"></button>
        <button class="icon-button" id="track-next" aria-label="Next track" title="Next track"><svg viewBox="0 0 24 24"><path d="M19 5v14M5 5l11 7-11 7Z"/></svg></button>
      </div>
    </section>
    <section class="center-panel focus-panel glass" id="focus-panel" aria-label="Focus timer" hidden>
      <div class="focus-copy">
        <label for="focus-task">CURRENT FOCUS</label>
        <input id="focus-task" type="text" value="Make something good." maxlength="100" autocomplete="off" spellcheck="false">
      </div>
      <div class="focus-controls">
        <button class="focus-clock" id="focus-reset" aria-label="Reset focus timer to 25 minutes" title="Reset to 25:00"><span id="focus-time" role="timer" aria-live="off">25:00</span></button>
        <button class="icon-button primary-play" id="focus-play" aria-label="Start focus timer" aria-pressed="false" title="Start focus timer"></button>
      </div>
    </section>
    <p class="ocean-status" id="ocean-status" role="status" aria-live="polite"></p>
  </main>

  <footer class="bottom-bar">
    <a class="credit mono" href="https://github.com/jiezi1234" target="_blank" rel="noopener noreferrer" title="jiezi1234 on GitHub">ascii ocean <span>↗</span></a>
    <div class="ocean-controls">
      <span class="interaction-hint mono">move gently. make a little ripple.</span>
      <div class="control-dock glass" role="toolbar" aria-label="Ocean controls">
        <button class="mode-button mono" id="style-toggle" aria-label="Cycle character styles. Current style is ASCII." title="Cycle character styles">ASCII</button>
        <span class="dock-divider"></span>
        <button class="icon-button" id="pause" aria-label="Pause animation" aria-pressed="false" title="Pause animation"></button>
        <button class="mode-button" id="theme" aria-label="Cycle water themes. Current theme is Deep Water.">Deep Water</button>
        <span class="dock-divider"></span>
        <button class="icon-button" id="settings-toggle" aria-label="Ocean settings" aria-expanded="false" aria-controls="settings-panel" title="Ocean settings">
          <svg viewBox="0 0 24 24"><path d="M5 4v5m0 4v7m7-16v9m0 4v3m7-16v2m0 4v10M2 9h6m1 8h6m1-11h6"/></svg>
        </button>
        <span class="dock-divider"></span>
        <button class="layout-button" id="layout-toggle" aria-label="Switch from Music to Focus" aria-controls="music-panel focus-panel" title="Switch to Focus">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 12h10m-3-3 3 3-3 3"/></svg>
          <span id="layout-label">Music</span><span class="layout-dots" aria-hidden="true"><i class="active"></i><i></i></span>
        </button>
      </div>
      <section class="popover glass settings-panel" id="settings-panel" aria-label="Ocean settings" hidden>
        <div class="panel-heading"><span>A little ocean</span><span class="mono">~ ~ ~</span></div>
        <label class="setting-label" for="water-theme">Water theme</label>
        <select id="water-theme">
          <option value="light">Day</option>
          <option value="dark">Night</option>
          <option value="deep" selected>Deep Water</option>
        </select>
        <label class="setting-label" for="render-mode">Character style</label>
        <select id="render-mode">
          <option value="braille">DOTS / Braille</option>
          <option value="geometry">GEO / Geometric shapes</option>
          <option value="ascii" selected>ASCII</option>
          <option value="hanzi">HANZI / Classic of Clarity and Stillness</option>
        </select>
        <p class="mode-description" id="mode-description">Monospaced characters and shaded cells shape the fish.</p>
        <label class="setting-label" for="roster">Marine life</label>
        <select id="roster">
          <option value="mixed">Mixed group</option>
          <optgroup label="Ocean Friends">
            <option value="manta">Manta ray</option>
            <option value="whaleshark">Whale shark</option>
            <option value="sunfish">Sunfish</option>
          </optgroup>
          <optgroup label="Sharks">
            <option value="classic">Classic shark</option>
            <option value="hammerhead">Hammerhead</option>
            <option value="greathammer">Great hammerhead</option>
            <option value="thresher">Thresher shark</option>
            <option value="zebra">Zebra shark</option>
            <option value="tiger">Tiger shark</option>
            <option value="mako">Mako shark</option>
            <option value="nurse">Nurse shark</option>
          </optgroup>
        </select>
        <div class="setting-label"><label for="speed">Swim speed</label><output id="speed-value" class="mono">0.65×</output></div>
        <input id="speed" type="range" min="0.25" max="1.5" step="0.05" value="0.65" aria-label="Swim speed">
        <div class="ocean-actions">
          <button type="button" id="add-shark"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add animal</button>
          <button type="button" id="ripple"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="9" ry="4"/><path d="M8 13c2 2 6 2 8 0M12 4v4"/></svg>Make a ripple</button>
        </div>
        <p class="panel-footnote">Pause to compare styles. Move near the fish or click the water to make a ripple.</p>
      </section>
    </div>
  </footer>
  <script src="./app.js" defer></script>
</body>
</html>
